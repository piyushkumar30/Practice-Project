<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <input type="text" id="display">
        <div class="div">

            <button class="clr">clr</button>
            <button>/</button>
        </div>
        <button>9</button>
        <button>8</button>
        <button>7</button>
        <button>*</button>
        <button>6</button>
        <button>5</button>
        <button>4</button>
        <button>-</button>
        <button>3</button>
        <button>2</button>
        <button>1</button>
        <button>+</button>
        <button>.</button>
        <button>0</button>
        <button class="equal">=</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
